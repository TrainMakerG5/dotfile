id = "local.pr-watch"
name = "PR Watch"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Toggle a compact pane that watches GitHub pull requests."
platforms = ["linux", "windows"]

[[startup]]
platforms = ["linux"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/restore-pr-watch.py\""]

[[startup]]
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "$python = if (Get-Command python -ErrorAction SilentlyContinue) { 'python' } else { 'py' }; & $python (Join-Path $env:HERDR_PLUGIN_ROOT 'bin\\restore-pr-watch.py'); exit $LASTEXITCODE"]

[[actions]]
id = "toggle-unix"
title = "Toggle pull request watch pane"
contexts = ["workspace"]
platforms = ["linux"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/toggle-pr-watch.sh\""]

[[actions]]
id = "toggle-windows"
title = "Toggle pull request watch pane"
contexts = ["workspace"]
platforms = ["windows"]
command = ["pwsh", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:HERDR_PLUGIN_ROOT 'bin\\toggle-pr-watch.ps1')"]
